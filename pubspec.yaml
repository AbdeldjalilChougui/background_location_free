name: background_location_free
description: Free, MIT-licensed background location for Android via a foreground service and LocationManager, with a native buffer and headless Dart callback.
version: 0.1.0
homepage: https://abdeldjalilchougui.biz/
repository: https://github.com/AbeldjalilChougui/background_location_free
issue_tracker: https://github.com/AbeldjalilChougui/background_location_free/issues
topics:
  - location
  - gps
  - background
  - android
  - plugin

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.abdeldjalilchougui.background_location_free
        pluginClass: BackgroundLocationFreePlugin
